name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x
  SLNX_PATH: ${{ github.workspace }}/src/R3EventsGenerator.slnx

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore
        run: dotnet restore "$SLNX_PATH"

      - name: Build
        run: dotnet build "$SLNX_PATH" --configuration Debug --no-restore

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_framework: net8.0
          - os: ubuntu-24.04
            target_framework: net9.0
          - os: ubuntu-24.04
            target_framework: net10.0
          - os: windows-2025
            target_framework: net48
    permissions:
      contents: read
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore
        run: dotnet restore "$SLNX_PATH"

      - name: Test
        run: dotnet test "$SLNX_PATH" --configuration Debug --no-restore -p:TargetFramework="${{ matrix.target_framework }}"
